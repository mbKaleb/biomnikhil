<svg viewBox="0 0 1180 880" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', ui-sans-serif, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d719a"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1180" height="880" fill="#0d1526"/>

  <!-- title -->
  <text x="590" y="46" text-anchor="middle" font-size="25" font-weight="700" fill="#eef3fb">Biomni lab app — three-layer architecture</text>
  <text x="590" y="73" text-anchor="middle" font-size="13.5" fill="#8ba0c4">Flask backend with swappable AI providers, deployable on Windows 11</text>

  <!-- ===================== LAYER 1 : PRESENTATION ===================== -->
  <rect x="40" y="96" width="1100" height="152" rx="14" fill="#131f38" stroke="#26375a"/>
  <text x="64" y="123" font-size="13" font-weight="600" fill="#4cc3f7">Layer 1 — Presentation</text>
  <text x="1116" y="123" text-anchor="end" font-size="12" fill="#7386a8">runs in the browser, any OS</text>

  <g>
    <rect x="64" y="136" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="80" y="168" font-size="15" font-weight="600" fill="#eef3fb">Web UI (chat)</text>
    <text x="80" y="192" font-size="12" fill="#9db0d0">submit prompts and lab tasks</text>
    <text x="80" y="212" font-size="12" fill="#7386a8">plain JS or React, nothing OS-specific</text>
  </g>
  <g>
    <rect x="422" y="136" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="438" y="168" font-size="15" font-weight="600" fill="#eef3fb">Live run monitor</text>
    <text x="438" y="192" font-size="12" fill="#9db0d0">agent steps stream in as they happen</text>
    <text x="438" y="212" font-size="12" fill="#7386a8">server-sent events, no websockets</text>
  </g>
  <g>
    <rect x="780" y="136" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="796" y="168" font-size="15" font-weight="600" fill="#eef3fb">Results viewer</text>
    <text x="796" y="192" font-size="12" fill="#9db0d0">reports, plots, generated files</text>
    <text x="796" y="212" font-size="12" fill="#7386a8">view inline or download</text>
  </g>

  <!-- arrow 1 -->
  <line x1="590" y1="252" x2="590" y2="290" stroke="#5d719a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="606" y="276" font-size="12" fill="#7c90b4">HTTP — JSON REST + SSE stream</text>

  <!-- ===================== LAYER 2 : APPLICATION ===================== -->
  <rect x="40" y="294" width="1100" height="302" rx="14" fill="#131f38" stroke="#26375a"/>
  <text x="64" y="321" font-size="13" font-weight="600" fill="#a78bfa">Layer 2 — Application</text>
  <text x="1116" y="321" text-anchor="end" font-size="12" fill="#7386a8">Flask (Python) on the lab machine</text>

  <g>
    <rect x="64" y="334" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="80" y="366" font-size="15" font-weight="600" fill="#eef3fb">Flask REST API</text>
    <text x="80" y="390" font-size="12" fill="#9db0d0">routes: /chat, /tasks, /results</text>
    <text x="80" y="410" font-size="12" fill="#7386a8">run under waitress (gunicorn is Unix-only)</text>
  </g>
  <g>
    <rect x="422" y="334" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="438" y="366" font-size="15" font-weight="600" fill="#eef3fb">Task runner</text>
    <text x="438" y="390" font-size="12" fill="#9db0d0">background threads + job registry</text>
    <text x="438" y="410" font-size="12" fill="#7386a8">long Biomni runs never block a request</text>
  </g>
  <g>
    <rect x="780" y="334" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="796" y="366" font-size="15" font-weight="600" fill="#eef3fb">Biomni wrapper (A1)</text>
    <text x="796" y="390" font-size="12" fill="#9db0d0">builds and invokes the agent</text>
    <text x="796" y="410" font-size="12" fill="#7386a8">captures each step via callbacks</text>
  </g>

  <!-- provider adapter -->
  <g>
    <rect x="64" y="446" width="1052" height="132" rx="12" fill="#1e1a3d" stroke="#8b78f5" stroke-width="1.6"/>
    <text x="84" y="477" font-size="15.5" font-weight="700" fill="#efeaff">AI provider adapter</text>
    <text x="1096" y="477" text-anchor="end" font-size="12" fill="#b3a6ec">pick a provider in .env — no code changes</text>
    <text x="84" y="499" font-size="12" fill="#a99ce0">one interface every provider implements: generate(), stream()</text>

    <rect x="171" y="514" width="96" height="36" rx="18" fill="#2a2354" stroke="#5f51ad"/>
    <text x="219" y="537" text-anchor="middle" font-size="12.5" fill="#d6ccfa">Claude</text>

    <rect x="283" y="514" width="96" height="36" rx="18" fill="#2a2354" stroke="#5f51ad"/>
    <text x="331" y="537" text-anchor="middle" font-size="12.5" fill="#d6ccfa">OpenAI</text>

    <rect x="395" y="514" width="96" height="36" rx="18" fill="#2a2354" stroke="#5f51ad"/>
    <text x="443" y="537" text-anchor="middle" font-size="12.5" fill="#d6ccfa">Gemini</text>

    <rect x="507" y="514" width="130" height="36" rx="18" fill="#2a2354" stroke="#5f51ad"/>
    <text x="572" y="537" text-anchor="middle" font-size="12.5" fill="#d6ccfa">Azure OpenAI</text>

    <rect x="653" y="514" width="190" height="36" rx="18" fill="#123024" stroke="#2f9e6e"/>
    <text x="748" y="537" text-anchor="middle" font-size="12.5" fill="#a7f3d0">Ollama — runs on-device</text>

    <rect x="859" y="514" width="150" height="36" rx="18" fill="#2a2354" stroke="#5f51ad"/>
    <text x="934" y="537" text-anchor="middle" font-size="12.5" fill="#d6ccfa">your own endpoint</text>
  </g>

  <!-- arrow 2 -->
  <line x1="590" y1="600" x2="590" y2="638" stroke="#5d719a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="606" y="624" font-size="12" fill="#7c90b4">reads data + files, HTTPS to model endpoints</text>

  <!-- ===================== LAYER 3 : DATA AND SERVICES ===================== -->
  <rect x="40" y="642" width="1100" height="152" rx="14" fill="#131f38" stroke="#26375a"/>
  <text x="64" y="669" font-size="13" font-weight="600" fill="#3ddba0">Layer 3 — Data and services</text>
  <text x="1116" y="669" text-anchor="end" font-size="12" fill="#7386a8">disk + model runtimes</text>

  <g>
    <rect x="64" y="682" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="80" y="714" font-size="15" font-weight="600" fill="#eef3fb">Biomni data lake</text>
    <text x="80" y="738" font-size="12" fill="#9db0d0">reference datasets (about 11 GB)</text>
    <text x="80" y="758" font-size="12" fill="#7386a8">plus the built-in tool library</text>
  </g>
  <g>
    <rect x="422" y="682" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="438" y="714" font-size="15" font-weight="600" fill="#eef3fb">Local storage</text>
    <text x="438" y="738" font-size="12" fill="#9db0d0">SQLite: sessions and task state</text>
    <text x="438" y="758" font-size="12" fill="#7386a8">outputs folder: plots, CSVs, reports</text>
  </g>
  <g>
    <rect x="780" y="682" width="336" height="96" rx="10" fill="#1b2a47" stroke="#33486f"/>
    <text x="796" y="714" font-size="15" font-weight="600" fill="#eef3fb">Model endpoints</text>
    <text x="796" y="738" font-size="12" fill="#9db0d0">cloud APIs: Anthropic, OpenAI, Google</text>
    <text x="796" y="758" font-size="12" fill="#7386a8">or Ollama serving models locally</text>
  </g>

  <!-- footer -->
  <line x1="40" y1="816" x2="1140" y2="816" stroke="#1d2b48" stroke-width="1"/>
  <text x="590" y="844" text-anchor="middle" font-size="12" fill="#7c90b4">Windows-native, no WSL or Docker — per-user Miniforge or venv + pip install biomni, waitress as WSGI server, threads not fork, PYTHONUTF8=1</text>
</svg>
