<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biomnikhil</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; background: #0d1526; color: #dbe4f3;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: .8rem;
      padding: .6rem 1rem; background: rgba(10, 17, 34, .85);
      backdrop-filter: blur(8px); border-bottom: 1px solid #1d2b48;
    }
    header h1 { font-size: 1.05rem; margin: 0; }
    #chat-name {
      font-size: .85rem; color: #7c90b4; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; min-width: 0;
      padding-left: .8rem; border-left: 1px solid #2c3f63;
    }
    #chat-name:empty { display: none; }
    header .provider-badge {
      margin-left: auto; font-size: .74rem; color: #7c90b4;
      padding: .2rem .65rem; border: 1px solid #2c3f63; border-radius: 999px;
      background: #131f38;
    }
    .content { display: flex; justify-content: center; padding: 1.5rem 1rem; }
    main { width: min(760px, 100%); }
    textarea {
      margin-top: 1rem; width: 100%; min-height: 90px; box-sizing: border-box; resize: vertical;
      background: #131f38; color: inherit; border: 1px solid #2c3f63;
      border-radius: 8px; padding: .7rem .8rem; font: inherit;
    }
    button {
      margin-top: .6rem; padding: .55rem 1.2rem; border: 0; border-radius: 8px;
      background: #3b5bdb; color: #fff; font: inherit; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #stop {
      background: #7a2333; border: 1px solid #a03247; margin-left: .5rem;
    }
    #stop:hover { background: #93293d; }
    /* ---- terminal-style trace panel (right) ---- */
    #trace {
      position: fixed; inset: 0 0 0 auto; width: min(400px, 85vw); z-index: 18;
      background: #05090f; border-left: 1px solid #1c2a2a;
      box-shadow: -8px 0 32px rgba(0, 0, 0, .5);
      transform: translateX(100%);
      transition: transform .25s cubic-bezier(.32, .72, .28, 1);
      display: flex; flex-direction: column; box-sizing: border-box;
    }
    #trace.open { transform: translateX(0); }
    #trace.resizing { transition: none; }
    #trace-resizer {
      position: absolute; left: -3px; top: 0; bottom: 0; width: 8px;
      cursor: col-resize; z-index: 1;
    }
    #trace-resizer:hover, #trace.resizing #trace-resizer { background: rgba(74, 222, 128, .18); }
    .trace-head {
      display: flex; align-items: center; gap: .45rem;
      padding: .55rem .8rem; background: #0a1118;
      border-bottom: 1px solid #16222c;
      font-family: ui-monospace, Consolas, monospace; font-size: .74rem;
      color: #5c7a6e;
    }
    .trace-head .trace-title { letter-spacing: .04em; }
    .trace-head .live {
      margin-left: auto; color: #4ade80; display: none;
    }
    #trace.running .trace-head .live { display: inline; }
    #close-trace {
      margin: 0 0 0 .6rem; padding: .1rem .4rem; background: transparent;
      color: #5c7a6e; font-size: .85rem; line-height: 1; border-radius: 5px;
    }
    #close-trace:hover { background: #14212b; color: #a9c7b8; }
    #steps {
      flex: 1; overflow-y: auto; padding: .8rem .9rem; margin: 0;
      white-space: pre-wrap; overflow-wrap: break-word;
      font-family: ui-monospace, Consolas, monospace; font-size: .76rem;
      line-height: 1.55; color: #8fd6a8;
      scrollbar-width: thin; scrollbar-color: #1c2a2a transparent;
    }
    #steps::-webkit-scrollbar { width: 6px; }
    #steps::-webkit-scrollbar-thumb { background: #1c2a2a; border-radius: 3px; }
    #steps .ln { display: block; margin-bottom: .7rem; }
    #steps .ln .k { color: #4a6b5c; user-select: none; }
    #steps .ln.system { color: #6b93b8; }
    #steps .seg { display: block; margin-top: .45rem; }
    #steps .seg:first-child { margin-top: 0; }
    #steps .seg-thought { color: #9db1cc; }
    #steps .seg-execute {
      background: #0a1420; border: 1px solid #16283c;
      border-left: 2px solid #3b82f6; border-radius: 6px;
      padding: .5rem .6rem; color: #a5c8ef;
      white-space: pre;
    }
    #steps .seg-execute .seg-body { overflow-x: auto; }
    #steps .seg-observation {
      background: #0a1410; border: 1px solid #16301f;
      border-left: 2px solid #22553a; border-radius: 6px;
      padding: .5rem .6rem; color: #8fd6a8;
    }
    #steps .seg-solution {
      background: #0f1a10; border: 1px solid #245332;
      border-left: 2px solid #4ade80; border-radius: 6px;
      padding: .5rem .6rem; color: #b5f0c8;
    }
    #steps .seg.tabular { white-space: pre; font-size: .68rem; }
    #steps .seg.tabular .seg-body {
      overflow-x: auto;
      scrollbar-width: thin; scrollbar-color: #1c2a2a transparent;
    }
    #steps .seg .seg-body::-webkit-scrollbar { height: 6px; }
    #steps .seg .seg-body::-webkit-scrollbar-thumb { background: #1c2a2a; border-radius: 3px; }
    #steps .seg .nan { color: #33473d; }
    #steps .seg.clamped .seg-body {
      max-height: 13em; overflow-y: hidden;
      -webkit-mask-image: linear-gradient(#000 60%, transparent);
      mask-image: linear-gradient(#000 60%, transparent);
    }
    #steps .seg-toggle {
      margin: .35rem 0 0; padding: .18rem .55rem; background: transparent;
      border: 1px solid #1c2a2a; border-radius: 6px; color: #5c7a6e;
      font-size: .65rem; font-family: inherit; line-height: 1.2;
    }
    #steps .seg-toggle:hover { background: #14212b; color: #a9c7b8; }
    #steps .seg-label {
      display: block; font-size: .62rem; text-transform: uppercase;
      letter-spacing: .12em; margin-bottom: .3rem; user-select: none;
    }
    #steps .seg-execute .seg-label { color: #3b82f6; }
    #steps .seg-observation .seg-label { color: #3a7d55; }
    #steps .seg-solution .seg-label { color: #4ade80; }
    #steps .cursor {
      display: inline-block; width: .55em; height: 1em; margin-left: 2px;
      background: #4ade80; vertical-align: text-bottom;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #trace-btn {
      margin: 0; padding: .35rem .6rem; background: transparent;
      border: 1px solid #2c3f63; border-radius: 8px; color: #7c90b4;
      font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
      line-height: 1;
    }
    #trace-btn:hover { background: #1a2a4c; color: #dbe4f3; }
    /* ---- sidebar ---- */
    #sidebar {
      position: fixed; inset: 0 auto 0 0; width: 288px; z-index: 20;
      background: linear-gradient(170deg, #0c1428 0%, #090f1f 100%);
      border-right: 1px solid #22335a;
      box-shadow: 8px 0 32px rgba(0, 0, 0, .45);
      transform: translateX(-100%);
      transition: transform .25s cubic-bezier(.32, .72, .28, 1);
      display: flex; flex-direction: column;
      box-sizing: border-box;
    }
    #sidebar.open { transform: translateX(0); }
    #backdrop {
      position: fixed; inset: 0; z-index: 15;
      background: rgba(4, 8, 18, .55); backdrop-filter: blur(2px);
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    #backdrop.show { opacity: 1; pointer-events: auto; }
    .sidebar-head {
      display: flex; align-items: center; justify-content: flex-end;
      padding: .6rem .6rem .4rem;
    }
    #close-sidebar {
      margin: 0; padding: .25rem .5rem; background: transparent;
      color: #7c90b4; font-size: .95rem; line-height: 1; border-radius: 6px;
    }
    #close-sidebar:hover { background: #1a2a4c; color: #dbe4f3; }
    .sidebar-body {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
      padding: .9rem .8rem;
    }
    #new-chat {
      margin: 0 0 .9rem; width: 100%; padding: .6rem; border-radius: 10px;
      background: linear-gradient(180deg, #4265e6, #3554cf);
      box-shadow: 0 2px 10px rgba(59, 91, 219, .35);
      text-align: center; font-weight: 600;
      transition: filter .15s, transform .1s;
    }
    #new-chat:hover { filter: brightness(1.1); }
    #new-chat:active { transform: translateY(1px); }
    .sidebar-label {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .1em;
      color: #4d5f84; margin: 0 .35rem .45rem; font-weight: 600;
    }
    #chat-list {
      list-style: none; margin: 0; padding: 0 .1rem 0 0;
      overflow-y: auto; flex: 1; scrollbar-width: thin;
      scrollbar-color: #22335a transparent;
    }
    #chat-list::-webkit-scrollbar { width: 6px; }
    #chat-list::-webkit-scrollbar-thumb { background: #22335a; border-radius: 3px; }
    #chat-list li {
      display: flex; align-items: center; gap: .55rem; padding: .5rem .6rem;
      border-radius: 9px; cursor: pointer; font-size: .85rem; color: #b9c8e4;
      margin-bottom: .2rem; border: 1px solid transparent;
      transition: background .12s, border-color .12s;
    }
    #chat-list li:hover { background: #131f3a; }
    #chat-list li.active {
      background: linear-gradient(90deg, #1c2c52, #172444);
      border-color: #2d4479; color: #fff;
    }
    #chat-list li.active::before {
      content: ""; width: 3px; height: 1.1rem; border-radius: 2px;
      background: #4d6ff0; margin-left: -.3rem; flex: none;
    }
    #chat-list .chat-meta { flex: 1; min-width: 0; }
    #chat-list .chat-title {
      display: block; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; line-height: 1.3;
    }
    #chat-list .chat-time {
      display: block; font-size: .68rem; color: #56688c; line-height: 1.3;
    }
    #chat-list li.active .chat-time { color: #7c90b4; }
    #chat-list .chat-actions { display: none; gap: .1rem; flex: none; }
    #chat-list li:hover .chat-actions,
    #chat-list li.active .chat-actions { display: flex; }
    #chat-list .chat-actions button {
      margin: 0; padding: .2rem .35rem; background: none; color: #7c90b4;
      font-size: .78rem; border-radius: 6px;
    }
    #chat-list .chat-actions button:hover { background: #263a63; color: #dbe4f3; }
    #chat-list input {
      flex: 1; min-width: 0; background: #0d1526; color: inherit; font: inherit;
      font-size: .85rem; border: 1px solid #3b5bdb; border-radius: 6px;
      padding: .2rem .45rem;
    }
    #chat-list .empty {
      color: #56688c; cursor: default; justify-content: center;
      border: 1px dashed #22335a; padding: 1rem;
    }
    #chat-list .empty:hover { background: none; }
    #menu-btn {
      margin: 0; padding: .4rem .6rem; background: transparent;
      border: 1px solid transparent; border-radius: 8px;
      color: #b9c8e4; font-size: 1rem; line-height: 1;
    }
    #menu-btn:hover { background: #1a2a4c; border-color: #2c3f63; }

    /* ---- chat messages ---- */
    #messages { margin-top: .25rem; }
    .msg {
      margin-top: .8rem; padding: .8rem 1rem; border-radius: 12px;
      white-space: pre-wrap; font-size: .92rem; max-width: 92%;
      box-sizing: border-box; overflow-wrap: break-word;
    }
    .msg.user {
      background: #23345e; border: 1px solid #33487c; margin-left: auto;
      border-bottom-right-radius: 4px; position: relative;
    }
    .retry-btn {
      position: absolute; left: -2.1rem; top: 50%;
      transform: translateY(-50%);
      margin: 0; padding: .2rem .45rem; background: #131f38;
      border: 1px solid #2c3f63; border-radius: 8px; color: #7c90b4;
      font-size: .85rem; line-height: 1;
      opacity: 0; transition: opacity .15s, background .15s;
    }
    .msg.user:hover .retry-btn { opacity: 1; }
    .retry-btn:hover { background: #1a2a4c; color: #dbe4f3; }
    .msg.assistant {
      background: #12233c; border: 1px solid #2c4a74; margin-right: auto;
      border-bottom-left-radius: 4px;
    }
    .msg.error { background: #2c1420; border-color: #6e2438; }

    /* ---- data lake modal ---- */
    #dl-modal {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: rgba(4, 8, 18, .65); backdrop-filter: blur(3px);
    }
    #dl-modal.show { display: flex; }
    .dl-card {
      width: min(440px, calc(100% - 2rem)); box-sizing: border-box;
      background: linear-gradient(170deg, #101b33, #0b1324);
      border: 1px solid #263a63; border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .55);
      padding: 1.5rem 1.6rem 1.4rem;
    }
    .dl-card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .dl-card .dl-icon { font-size: 1.9rem; display: block; margin-bottom: .6rem; }
    .dl-card p { margin: 0 0 1rem; color: #93a6c4; font-size: .86rem; }
    .dl-bar {
      height: 10px; border-radius: 999px; background: #0a1020;
      border: 1px solid #22335a; overflow: hidden;
    }
    .dl-bar .fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg, #3b5bdb, #6b8cff);
      transition: width .6s ease;
    }
    .dl-bar .fill.indeterminate {
      width: 30%;
      animation: dl-slide 1.4s ease-in-out infinite;
    }
    @keyframes dl-slide {
      0% { margin-left: -30%; }
      100% { margin-left: 100%; }
    }
    .dl-stats {
      display: flex; justify-content: space-between; margin-top: .45rem;
      font-size: .76rem; color: #7c90b4;
      font-variant-numeric: tabular-nums;
    }
    .dl-progress { display: none; margin-bottom: 1rem; }
    #dl-modal.downloading .dl-progress { display: block; }
    #dl-modal.downloading .dl-choices { display: none; }
    .dl-choices { display: flex; gap: .6rem; justify-content: flex-end; }
    .dl-choices .secondary {
      background: transparent; border: 1px solid #2c3f63; color: #93a6c4;
    }
    .dl-choices .secondary:hover { background: #131f38; }
    .dl-note { font-size: .74rem; color: #56688c; margin-top: .9rem; }
    .tabs {
      display: flex; gap: .25rem; margin-bottom: 1rem;
      border-bottom: 1px solid #2c3f63;
    }
    .tabs button {
      margin: 0; padding: .5rem 1rem; background: none; color: #7c90b4;
      border-radius: 8px 8px 0 0; cursor: pointer;
    }
    .tabs button.active { background: #131f38; color: #dbe4f3; }
    .panel { display: none; }
    .panel.active { display: block; }
    #dropzone {
      border: 1.5px dashed #35507f; border-radius: 12px; padding: 2rem 1rem;
      text-align: center; color: #7c90b4; cursor: pointer;
      background: linear-gradient(180deg, #111c33, #0e1729);
      transition: border-color .15s, background .15s, transform .1s;
    }
    #dropzone:hover, #dropzone.dragover {
      border-color: #5b7fe8; color: #a9bce0; background: #14213d;
    }
    #dropzone .dz-icon { font-size: 1.6rem; display: block; margin-bottom: .35rem; }
    #dropzone .dz-hint { font-size: .78rem; opacity: .75; }
    #file-list { list-style: none; margin: 1.1rem 0 0; padding: 0; }
    #file-list li {
      display: flex; align-items: center; gap: .7rem; padding: .6rem .8rem;
      background: #131f38; border: 1px solid #24365a; border-radius: 10px;
      margin-bottom: .45rem; font-size: .86rem;
      transition: border-color .15s, background .15s;
    }
    #file-list li:hover { border-color: #3a5590; background: #162442; }
    #file-list li.empty {
      justify-content: center; color: #56688c; border-style: dashed;
      background: transparent;
    }
    #file-list .file-icon {
      width: 30px; height: 30px; border-radius: 8px; flex: none;
      display: grid; place-items: center; font-size: .9rem;
      background: #1d2f55; border: 1px solid #2c4a74;
    }
    #file-list .meta { min-width: 0; }
    #file-list .name {
      display: block; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    #file-list .size { display: block; color: #7c90b4; font-size: .74rem; }
    .attach-toggle {
      margin-left: auto; flex: none; padding: .28rem .75rem; font-size: .74rem;
      border-radius: 999px; border: 1px solid #35507f; background: transparent;
      color: #7c90b4; cursor: pointer; margin-top: 0;
      transition: background .15s, color .15s, border-color .15s;
    }
    .attach-toggle.on {
      background: #3b5bdb; border-color: #3b5bdb; color: #fff;
    }
    .file-remove {
      flex: none; width: 1.7rem; height: 1.7rem; padding: 0; margin-top: 0;
      border-radius: 999px; border: 1px solid #35507f; background: transparent;
      color: #7c90b4; cursor: pointer; font-size: .74rem; line-height: 1;
      transition: background .15s, color .15s, border-color .15s;
    }
    .file-remove:hover { background: #b03547; border-color: #b03547; color: #fff; }
    #upload-status { margin-top: .6rem; font-size: .85rem; color: #7c90b4; min-height: 1.2em; }
    .attach-hint { margin-top: .5rem; font-size: .8rem; color: #7c90b4; }
  </style>
</head>
<body>
  <header>
    <button id="menu-btn" title="Chats">&#9776;</button>
    <h1>biomnikhil</h1>
    <span id="chat-name"></span>
    <span class="provider-badge">Biomni agent · {{ provider }}</span>
    <button id="trace-btn" title="Agent trace">&gt;_</button>
  </header>

  <aside id="trace">
    <div id="trace-resizer" title="Drag to resize"></div>
    <div class="trace-head">
      <span class="trace-title">&gt;_ agent trace</span>
      <span class="live">&#9679; running</span>
      <button id="close-trace" title="Close">&#10005;</button>
    </div>
    <div id="steps"></div>
  </aside>

  <div id="dl-modal">
    <div class="dl-card">
      <span class="dl-icon">&#128452;&#65039;</span>
      <h3>Download the Biomni data lake</h3>
      <p>The agent needs its reference data before it can run tasks.</p>
      <div class="dl-progress">
        <div class="dl-bar"><div class="fill" id="dl-fill"></div></div>
        <div class="dl-stats">
          <span id="dl-bytes">0 B</span>
          <span id="dl-percent">0%</span>
        </div>
        <div class="dl-stats"><span id="dl-files"></span><span id="dl-eta"></span></div>
      </div>
      <div class="dl-choices">
        <button class="secondary" id="dl-later">Later</button>
        <button id="dl-start">Download now</button>
      </div>
      <div class="dl-note" id="dl-note"></div>
    </div>
  </div>

  <div id="backdrop"></div>
  <aside id="sidebar">
    <div class="sidebar-head">
      <button id="close-sidebar" title="Close">&#10005;</button>
    </div>
    <div class="sidebar-body">
      <button id="new-chat">+ New chat</button>
      <div class="sidebar-label">Recent chats</div>
      <ul id="chat-list"></ul>
    </div>
  </aside>

  <div class="content">
  <main>

    <nav class="tabs">
      <button class="active" data-tab="task">Task</button>
      <button data-tab="files">Files</button>
    </nav>

    <section id="tab-task" class="panel active">
      <div id="messages"></div>
      <textarea id="prompt" placeholder="Ask the agent something…"></textarea>
      <button id="run">Run task</button>
      <button id="stop" hidden>&#9632; Stop</button>
      <div class="attach-hint" id="attach-hint" hidden></div>
    </section>

    <section id="tab-files" class="panel">
      <div id="dropzone">
        <span class="dz-icon">&#128193;</span>
        <strong>Drop files here</strong> or click to browse
        <div class="dz-hint">Uploads are attached to your next task automatically</div>
      </div>
      <input type="file" id="file-input" multiple hidden>
      <div id="upload-status"></div>
      <ul id="file-list"></ul>
    </section>
  </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
